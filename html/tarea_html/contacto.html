<!doctype html>
<html lang="es">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Contacto - Tarea HTML</title>
</head>
<body>
  <header>
    <h1>Contacto</h1>
  </header>

  <nav>
    <ul>
      <li><a href="index.html">Inicio</a></li>
      <li><a href="acerca.html">Acerca</a></li>
      <li><a href="servicios.html">Servicios</a></li>
      <li><a href="tabla.html">Tabla</a></li>
      <li><a href="contacto.html">Contacto</a></li>
    </ul>
  </nav>

  <main>
    <section>
      <h2>Formulario de contacto</h2>
      <form action="#" method="post">
        <fieldset>
          <legend>Información personal</legend>
          <label for="nombre">Nombre completo</label>
          <input type="text" id="nombre" name="nombre" required>

          <label for="email">Correo electrónico</label>
          <input type="email" id="email" name="email" required>

          <label for="edad">Edad</label>
          <input type="number" id="edad" name="edad" min="16" max="120">

          <label for="fecha">Fecha de nacimiento</label>
          <input type="date" id="fecha" name="fecha">
        </fieldset>

        <fieldset>
          <legend>Preferencias</legend>
          <p>Selecciona los medios de contacto:</p>
          <label><input type="checkbox" name="medio" value="email"> Email</label>
          <label><input type="checkbox" name="medio" value="telefono"> Teléfono</label>

          <p>¿Ha asistido a cursos anteriormente?</p>
          <label><input type="radio" name="cursos" value="si"> Sí</label>
          <label><input type="radio" name="cursos" value="no"> No</label>
        </fieldset>

        <label for="mensaje">Mensaje</label>
        <textarea id="mensaje" name="mensaje" rows="5"></textarea>

        <label for="asunto">Asunto</label>
        <select id="asunto" name="asunto">
          <option value="consulta">Consulta</option>
          <option value="soporte">Soporte</option>
          <option value="otro">Otro</option>
        </select>

        <button type="submit">Enviar</button>
      </form>
    </section>
  </main>

  <footer>
    <p>Profesor: Ing. Francisco Higuera</p>
  </footer>
</body>
</html>
